[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gasp-rag"
dynamic = ["version"]
description = "Span-level detection of ungrounded content in retrieval-augmented generation by grounding sensitivity."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohamed Aly Bouke", email = "bouke@ieee.org" }]
keywords = [
    "hallucination-detection",
    "retrieval-augmented-generation",
    "rag",
    "faithfulness",
    "large-language-models",
    "explainable-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
torch = ["torch>=2.0", "transformers>=4.40"]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
gasp = "gasp.cli:main"

[project.urls]
Homepage = "https://github.com/drbouke/GASP"
Repository = "https://github.com/drbouke/GASP"
Issues = "https://github.com/drbouke/GASP/issues"

[tool.hatch.version]
path = "src/gasp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
